name: CodeQL

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            runs_on: ubuntu-latest
            needs_node: true
            needs_python: false
            needs_java: false
            needs_swift_tools: false
            needs_manual_build: false
            needs_autobuild: false
            config_file: ./.github/codeql/codeql-javascript-typescript.yml
          - language: actions
            runs_on: ubuntu-latest
            needs_node: false
            needs_python: false
            needs_java: false
            needs_swift_tools: false
            needs_manual_build: false
            needs_autobuild: false
            config_file: ""
          - language: python
            runs_on: ubuntu-latest
            needs_node: false
            needs_python: true
            needs_java: false
            needs_swift_tools: false
            needs_manual_build: false
            needs_autobuild: false
            config_file: ""
          - language: java-kotlin
            runs_on: ubuntu-latest
            needs_node: false
            needs_python: false
            needs_java: true
            needs_swift_tools: false
            needs_manual_build: true
            needs_autobuild: false
            config_file: ""
          - language: swift
            runs_on: macos-15
            needs_node: false
            needs_python: false
            needs_java: false
            needs_swift_tools: true
            needs_manual_build: true
            needs_autobuild: false
            config_file: ""
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: false

      - name: Setup Node environment
        if: matrix.needs_node
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          use-sticky-disk: "false"

      - name: Setup Python
        if: matrix.needs_python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Setup Java
        if: matrix.needs_java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Swift build tools
        if: matrix.needs_swift_tools
        run: |
          set -euo pipefail
          # Prefer Xcode 16.4: ships with iOS Simulator runtime on macos-15 and
          # matches apps/ios/project.yml (xcodeVersion 16.0, iOS 18.0).
          # Xcode 26.1.app is present on GHA but its iOS 26.1 platform/runtime is
          # often missing → generic/platform=iOS Simulator fails with exit 70.
          XCODE_APP=""
          for candidate in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.1.app; do
            if [[ -d "$candidate" ]]; then
              XCODE_APP="$candidate"
              break
            fi
          done
          if [[ -z "$XCODE_APP" ]]; then
            echo "error: no suitable Xcode.app found under /Applications" >&2
            ls /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          echo "Selected Xcode: $XCODE_APP"
          xcodebuild -version
          xcodebuild -showsdks
          # Warm CoreSimulator so destination discovery is reliable on GHA.
          xcrun simctl list >/dev/null 2>&1 || true
          if ! xcodebuild -showsdks 2>/dev/null | grep -q 'iphonesimulator'; then
            echo "iOS Simulator SDK missing; downloading platform (may take several minutes)..."
            xcodebuild -downloadPlatform iOS
            xcrun simctl list >/dev/null 2>&1 || true
            xcodebuild -showsdks
          fi
          if ! xcodebuild -showsdks 2>/dev/null | grep -q 'iphonesimulator'; then
            echo "error: iOS Simulator SDK still unavailable after downloadPlatform" >&2
            exit 1
          fi
          brew install xcodegen swiftlint swiftformat
          swift --version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b25d0ebf40e5b63ee81e1bd6e5d2a12b7c2aeb61 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: ${{ matrix.config_file || '' }}

      - name: Autobuild
        if: matrix.needs_autobuild
        uses: github/codeql-action/autobuild@b25d0ebf40e5b63ee81e1bd6e5d2a12b7c2aeb61 # v4

      - name: Build Android for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assemblePlayDebug

      - name: Build Swift for CodeQL
        if: matrix.language == 'swift'
        run: |
          set -euo pipefail
          swift build --package-path apps/macos --configuration release
          cd apps/ios
          xcodegen generate
          # Prefer generic iOS Simulator once an SDK is present (setup step).
          # Fall back to the first available simulator destination if needed.
          DEST="generic/platform=iOS Simulator"
          if ! xcodebuild -showdestinations -project OpenClaw.xcodeproj -scheme OpenClaw 2>/dev/null \
            | grep -q 'platform:iOS Simulator'; then
            echo "generic iOS Simulator destination unavailable; probing showdestinations..."
            xcodebuild -showdestinations -project OpenClaw.xcodeproj -scheme OpenClaw || true
            FALLBACK="$(xcodebuild -showdestinations -project OpenClaw.xcodeproj -scheme OpenClaw 2>/dev/null \
              | sed -n 's/.*platform:iOS Simulator,[[:space:]]*id:\([^,}]*\).*/id=\1/p' \
              | head -n1 || true)"
            if [[ -n "${FALLBACK}" ]]; then
              DEST="$FALLBACK"
              echo "Using fallback destination: $DEST"
            fi
          fi
          xcodebuild build \
            -project OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -destination "$DEST" \
            CODE_SIGNING_ALLOWED=NO

      - name: Analyze
        uses: github/codeql-action/analyze@b25d0ebf40e5b63ee81e1bd6e5d2a12b7c2aeb61 # v4
        with:
          category: "/language:${{ matrix.language }}"
