name: Debug check components

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          use-sticky-disk: "false"

      - name: Probe check components
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set +e
          probe() {
            name="$1"; shift
            out_file="/tmp/probe-$$.txt"
            "$@" >"$out_file" 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "PASS: $name"
            else
              tail_bytes=$(tail -c 1400 "$out_file" | tr '\n' '%' | sed 's/%/%0A/g')
              echo "::error title=$name (exit $status)::${tail_bytes:0:1200}"
            fi
          }
          probe no-conflict-markers pnpm check:no-conflict-markers
          probe tool-display pnpm tool-display:check
          probe host-env-policy-swift pnpm check:host-env-policy:swift
          probe tsgo pnpm tsgo
          probe lint pnpm lint
          probe lint-webhook pnpm lint:webhook:no-low-level-body-read
          probe lint-auth-pairing-store pnpm lint:auth:no-pairing-store-group
          probe lint-auth-pairing-scope pnpm lint:auth:pairing-account-scope
          probe import-cycles pnpm check:import-cycles
          probe madge-import-cycles pnpm check:madge-import-cycles
